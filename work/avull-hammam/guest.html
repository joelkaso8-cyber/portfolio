<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self' https://www.google.com https://www.youtube-nocookie.com https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https: mailto:">
<meta name="referrer" content="strict-origin-when-cross-origin">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Guest guide</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="gfonts/gf-21cad730.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- For a QR code on the table, in the room or at the till: it links to /guest.html. Not listed on Google. -->
  <main class="page">
    <div class="page__head">
      <a class="brand" href="./" data-fill="name"></a>
      <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="sq" aria-pressed="false">SQ</button></div>
    </div>
    <section class="tile">
      <h2 data-i18n="guest.wifi">Wi-Fi</h2>
      <dl class="wifi"><dt data-i18n="guest.network">Network</dt><dd id="wifi-name"></dd><dt data-i18n="guest.password">Password</dt><dd id="wifi-pass"></dd></dl>
      <button class="btn" type="button" id="copy" data-i18n="guest.copy">Copy password</button>
    </section>
    <section class="tile"><h2 data-i18n="guest.hours">Opening hours</h2><ul class="hours" id="g-hours"></ul></section>
    <section class="tile"><h2 data-i18n="guest.info">Good to know</h2><ul class="notes" id="g-notes"></ul></section>
    <section class="tile"><h2 data-i18n="guest.around">Around here</h2><ul class="places" id="g-places"></ul></section>
    <a class="btn btn--wa" id="g-wa" href="#" target="_blank" rel="noopener noreferrer" data-i18n="guest.msg">Message us on WhatsApp</a>
  </main>
  <script src="i18n.js"></script>
  <script>
    ;(function () {
      var $ = function (s) { return document.querySelector(s) }, C = null
      var lang = 'en'; try { lang = localStorage.getItem('site-lang') || ((navigator.language || '').toLowerCase().indexOf('sq') === 0 ? 'sq' : 'en') } catch (e) {}
      var t = function (k) { return (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k }
      var pick = function (o) { return typeof o === 'string' ? o : (o && (o[lang] || o.en)) || '' }
      function render() {
        document.documentElement.lang = lang
        document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.dataset.i18n) })
        document.querySelectorAll('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === lang)) })
        if (!C) return
        var g = C.guest || {}
        document.title = C.business.name + ' · ' + (lang === 'sq' ? 'Udhëzues' : 'Guest guide')
        document.querySelectorAll('[data-fill="name"]').forEach(function (el) { el.textContent = C.business.name })
        $('#wifi-name').textContent = g.wifiName || '–'; $('#wifi-pass').textContent = g.wifiPassword || '–'
        var days = t('days'), keys = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'], ul = $('#g-hours'); ul.innerHTML = ''
        keys.forEach(function (k, i) { var h = C.hours[k], li = document.createElement('li'); li.innerHTML = '<span></span><span></span>'; li.children[0].textContent = days[i]; li.children[1].textContent = h ? h[0] + '–' + h[1] : t('closed'); ul.appendChild(li) })
        var n = $('#g-notes'); n.innerHTML = ''; (g.notes || []).forEach(function (x) { var li = document.createElement('li'); li.textContent = pick(x); n.appendChild(li) })
        var p = $('#g-places'); p.innerHTML = ''
        ;(g.places || []).forEach(function (x) { var li = document.createElement('li'), a = document.createElement('a'); a.href = x.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.innerHTML = '<b></b><small></small>'; a.firstChild.textContent = x.name + ' ↗'; a.lastChild.textContent = pick(x.tip); li.appendChild(a); p.appendChild(li) })
        $('#g-wa').href = 'https://wa.me/' + C.business.whatsapp
      }
      document.querySelectorAll('[data-lang]').forEach(function (b) { b.addEventListener('click', function () { lang = b.dataset.lang; try { localStorage.setItem('site-lang', lang) } catch (e) {} render() }) })
      $('#copy').addEventListener('click', function () {
        var pass = (C && C.guest && C.guest.wifiPassword) || '', btn = $('#copy')
        var done = function () { btn.textContent = t('guest.copied') + ' ✓'; setTimeout(function () { btn.textContent = t('guest.copy') }, 2000) }
        if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(pass).then(done, done)
        else { var ta = document.createElement('textarea'); ta.value = pass; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy') } catch (e) {} ta.remove(); done() }
      })
      render()
      fetch('site-config.json', { cache: 'no-cache' }).then(function (r) { return r.json() }).then(function (c) {
        C = c; if (c.theme) { var s = document.documentElement.style; if (c.theme.ground) s.setProperty('--ground', c.theme.ground); if (c.theme.accent) s.setProperty('--accent', c.theme.accent); if (c.theme.accentInk) s.setProperty('--accent-ink', c.theme.accentInk) }
        render()
      })
    })()
  </script>
<script src="form-guard.js" defer></script>
</body>
</html>
